databases:
  - name: dealflow360-db
    databaseName: dealflow360
    plan: free
    region: oregon

services:
  - type: web
    name: dealflow360-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend/core-api
    buildCommand: npm install && npm run db:push && npm run build && npm run seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dealflow360-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PORTAL_JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: PORTAL_JWT_EXPIRES_IN
        value: 12h
      - key: CORS_ORIGIN
        value: http://localhost:3000
      - key: LOG_LEVEL
        value: info
      - key: SMART_LAYER_BASE_URL
        value: https://dealflow360-smart-layer.onrender.com

  - type: web
    name: dealflow360-smart-layer
    runtime: python
    plan: free
    region: oregon
    rootDir: backend/smart-layer
    buildCommand: pip install -r requirements.txt && python train_win_predictor.py
    startCommand: uvicorn gateway:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

